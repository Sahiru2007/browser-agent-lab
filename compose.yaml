# Optional database service for local development; the control runner uses SQLite.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  lab-postgres:
